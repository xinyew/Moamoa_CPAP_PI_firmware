board:
  name: kmm_pmask_control
  full_name: KMM PMask Control Board
  vendor: kamoamoa
  socs:
    - name: nrf52840

runners:
  run_once:
    '--recover':
      - runners:
          - nrfutil
        run: first
        groups:
          - boards:
              - kmm_pmask_control/nrf52840
    '--erase':
      - runners:
          - jlink
          - nrfutil
        run: first
        groups:
          - boards:
              - kmm_pmask_control/nrf52840
    '--reset':
      - runners:
          - jlink
          - nrfutil
        run: last
        groups:
          - boards:
              - kmm_pmask_control/nrf52840
