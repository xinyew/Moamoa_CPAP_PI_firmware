CONFIG_PRINTK=y
CONFIG_LOG=y

CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_GPIO=y

# TCA9548A mux: channel buses must init after the root mux, which must
# init after the underlying I2C controller (I2C_INIT_PRIORITY = 50)
CONFIG_I2C_TCA954X_ROOT_INIT_PRIO=60
CONFIG_I2C_TCA954X_CHANNEL_INIT_PRIO=70

# In-tree sensor drivers: MAX30101 x4 (configures mode + LED currents at
# init -> LEDs light up), SHT4x x3, TMP117 x3. Sensor devices must init
# after the mux channel buses (prio 70).
CONFIG_SENSOR=y
CONFIG_SENSOR_INIT_PRIORITY=80
CONFIG_MAX30101=y
CONFIG_SHT4X=y
CONFIG_TMP11X=y

# microSD card (SPI mode) via the disk subsystem
CONFIG_DISK_ACCESS=y
CONFIG_SDHC=y
CONFIG_SDMMC_STACK=y
CONFIG_DISK_DRIVER_SDMMC=y

# SD logging: FAT filesystem + MCUmgr file download (BLE log fetch)
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
# The SD writer thread and MCUmgr FS reads share the volume — FatFs
# must be reentrant (per-volume mutex) or concurrent access fails
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_MCUMGR_GRP_FS=y
# Log files are multi-MB (the default profile assumes <=64 KB files)
CONFIG_MCUMGR_GRP_FS_MAX_FILE_SIZE_4GB=y
# fs_mgmt reads the chunk into a stack buffer on the MCUmgr workqueue
# (2 KB default -> stack overflow): bound the chunk and grow the stack
CONFIG_MCUMGR_GRP_FS_DL_CHUNK_SIZE_LIMIT=y
CONFIG_MCUMGR_GRP_FS_DL_CHUNK_SIZE=4096
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=8192

CONFIG_MYFUNC=n



# BLE — peripheral, Nordic UART Service (NUS) sensor stream
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="CPAP_PI_Control"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_NUS=y

# Throughput: DLE 251 so a 204 B DATA frame fits one link packet.
# L2CAP MTU / ACL RX are sized for MCUmgr SMP reassembly (16 KB frames
# arrive as pipelined 498 B L2CAP SDUs) — caterpillar-proven values.
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=20
CONFIG_BT_CONN_TX_MAX=10
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

# 2M PHY request on connect (halves airtime per notification)
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_PHY_UPDATE=y

# --- OTA DFU: MCUmgr SMP over BLE (ported from caterpillar v1.5.1) ---
# MCUMGR *depends on* (doesn't select) these:
CONFIG_ZCBOR=y
CONFIG_NET_BUF=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
# Let clients query our buffer size so they use full-size upload chunks
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
# Erase the target slot page-by-page during upload instead of all
# upfront — a bulk ~440 KB erase stalls the first upload chunk
CONFIG_IMG_ERASE_PROGRESSIVELY=y
# Renegotiate fast connection parameters while SMP traffic is active
# (Windows defaults to lazy ~60 ms intervals otherwise), relax after.
# Wide request window (7.5-30 ms): Windows rejects narrow aggressive
# requests outright but grants ~15 ms from a range it likes.
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_MIN_INT=6
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_MAX_INT=24
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_REBOOT=y
# Big SMP frames: each request/response cycle carries ~16 KB, amortizing
# the per-chunk round-trip stall (the fragments themselves stream as
# pipelined writes).  Two buffers instead of four to keep RAM in check.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=16384
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=2

# Increase stacks for BLE workqueue traffic
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
